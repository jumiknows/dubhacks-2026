name: Repository labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repository-labels
  cancel-in-progress: false

jobs:
  labels:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...context.repo,
              per_page: 100
            });
            const names = new Set(existing.map(label => label.name));
            for (const label of labels) {
              if (names.has(label.name)) {
                await github.rest.issues.updateLabel({ ...context.repo, ...label });
              } else {
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              }
            }
            core.info(`Synchronized ${labels.length} repository labels.`);
