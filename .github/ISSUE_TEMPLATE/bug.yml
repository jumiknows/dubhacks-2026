name: Bug
description: Report a reproducible failure
labels: ["type:bug", "status:backlog"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the steps and inputs needed to reproduce the failure.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and commit
      description: Browser, operating system, runtime, or tested commit as relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add useful logs or screenshots without private data or credentials.
